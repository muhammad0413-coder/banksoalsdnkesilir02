<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDN KESILIR 02 LABS - AI Assessment Generator V2</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        // GitHub Dark Theme Colors
                        primary: { 50: '#f0f6fc', 100: '#c9d1d9', 200: '#b1bac4', 300: '#8b949e', 400: '#58a6ff', 500: '#1f6feb', 600: '#238636', 700: '#2ea043', 800: '#21262d', 900: '#0d1117', 950: '#010409' },
                    }
                }
            }
        }
    </script>
    
    <!-- Icons (Phosphor) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid white; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Print Specific Styles */
        @media print {
            body { background-color: white !important; overflow: visible !important; height: auto !important; color: black; font-size: 12pt; }
            #root { height: auto !important; overflow: visible !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { padding: 0; width: 100%; max-width: none; background: white; margin: 0; border: none; box-shadow: none; overflow: visible !important; }
            
            /* Typography for print */
            h1, h2, h3, h4 { page-break-after: avoid; color: black !important; }
            p, div, li { page-break-inside: avoid; }
            
            /* Table formatting */
            table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            th, td { border: 1px solid black !important; padding: 8px; text-align: left; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            
            /* Page breaks */
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            
            /* Hide UI elements */
            .editor-controls, button, input[type="text"]:not(.print-input) { display: none !important; }
        }
        .print-only { display: none; }
        
        /* WYSIWYG reset for print styling */
        .print-content p { margin-bottom: 0.5rem; }
        .print-content b { font-weight: bold; }
        .print-table { border-collapse: collapse; width: 100%; }
        .print-table th, .print-table td { border: 1px solid #000; padding: 6px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const LEVELS = {
            "PAUD/TK": ["Kelompok A", "Kelompok B", "Bermain"],
            "SD/MI": ["1", "2", "3", "4", "5", "6"],
            "SMP/MTs": ["7", "8", "9"],
            "SMA/MA/SMK": ["10", "11", "12"],
            "Perguruan Tinggi": ["Semester 1", "Semester 2", "Semester 3", "Semester 4", "Semester 5", "Semester 6", "Semester 7", "Semester 8"],
            "Umum": ["Tingkat Dasar", "Tingkat Menengah", "Tingkat Mahir"]
        };

        const ASSESSMENT_TYPES = ["Diagnostik", "Formatif", "Sumatif", "PTS", "PAS", "PAT", "Ujian Sekolah", "Pre-Test", "Post-Test", "Kuis", "Remedial", "Pengayaan", "Proyek", "Praktik"];
        const QUESTION_TYPES = ["Pilihan Ganda", "Pilihan Ganda Kompleks", "Benar/Salah", "Menjodohkan", "Isian Singkat", "Uraian", "Esai", "Studi Kasus", "Literasi", "Numerasi", "Analisis Gambar", "HOTS", "LOTS"];
        const COGNITIVE_LEVELS = ["C1 (Mengingat)", "C2 (Memahami)", "C3 (Mengaplikasikan)", "C4 (Menganalisis)", "C5 (Mengevaluasi)", "C6 (Mencipta)"];
        const DIFFICULTIES = ["Mudah", "Sedang", "Sulit", "Campuran"];

        const generateId = () => Math.random().toString(36).substring(2, 15) + Date.now().toString(36);

        // Utility to export HTML to MS Word
        const exportHTMLToWord = (elementId, filename = 'document.doc') => {
            const el = document.getElementById(elementId);
            if (!el) return;
            
            // Create a clone to strip out no-print elements for Word
            const clone = el.cloneNode(true);
            const noPrintElements = clone.querySelectorAll('.no-print');
            noPrintElements.forEach(n => n.remove());

            const preHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title><style>body { font-family: Arial, sans-serif; } table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid black; padding: 5px; text-align: left; }</style></head><body>`;
            const postHtml = "</body></html>";
            const html = preHtml + clone.innerHTML + postHtml;

            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
            const downloadLink = document.createElement("a");
            
            document.body.appendChild(downloadLink);
            if (navigator.msSaveOrOpenBlob) {
                navigator.msSaveOrOpenBlob(blob, filename);
            } else {
                downloadLink.href = url;
                downloadLink.download = filename;
                downloadLink.click();
            }
            document.body.removeChild(downloadLink);
        };

        const useAppStore = () => {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key_v2') || '');
            const [assessments, setAssessments] = useState(() => {
                const saved = localStorage.getItem('sdn_assessments_v2');
                return saved ? JSON.parse(saved) : [];
            });
            const [toast, setToast] = useState(null);

            useEffect(() => { localStorage.setItem('gemini_api_key_v2', apiKey); }, [apiKey]);
            useEffect(() => { localStorage.setItem('sdn_assessments_v2', JSON.stringify(assessments)); }, [assessments]);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const saveAssessment = (data) => {
                setAssessments(prev => {
                    const exists = prev.find(a => a.id === data.id);
                    if (exists) return prev.map(a => a.id === data.id ? data : a);
                    return [data, ...prev];
                });
            };
            
            const deleteAssessment = (id) => setAssessments(prev => prev.filter(a => a.id !== id));

            return { apiKey, setApiKey, assessments, saveAssessment, deleteAssessment, toast, showToast };
        };

        const extractJSON = (text) => {
            try { return JSON.parse(text); } 
            catch (e) {
                const match = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
                if (match) {
                    try { return JSON.parse(match[1]); } catch(e2) {}
                }
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                if (start !== -1 && end !== -1 && start < end) {
                    try { return JSON.parse(text.substring(start, end + 1)); } catch(e3) {}
                }
                throw new Error("Gagal mengurai respons AI. Pastikan instruksi jelas.");
            }
        };

        const generateWithGemini = async (prompt, apiKey) => {
            if (!apiKey || apiKey.trim() === '') throw new Error("API_KEY_MISSING");
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const systemInstruction = `Anda adalah Ahli Evaluasi Pendidikan Profesional. Hasilkan instrumen asesmen lengkap dalam format JSON yang valid. 
            Struktur JSON wajib:
            {
                "kisiKisi": [ { "no": 1, "tujuan": "...", "materi": "...", "indikator": "...", "level": "C3", "bentuk": "Pilihan Ganda", "kesulitan": "Sedang", "skor": 10 } ],
                "soal": [
                    { "id": "uuid-1", "no": 1, "tipe": "Pilihan Ganda", "pertanyaan": "...", "opsi": ["A. ...", "B. ...", "C. ...", "D. ..."], "jawaban": "A", "pembahasan": "...", "skor": 10, "kesulitan": "Sedang", "kognitif": "C3" },
                    { "id": "uuid-2", "no": 2, "tipe": "Uraian", "pertanyaan": "...", "jawabanIdeal": "...", "pedomanPenskoran": "...", "skor": 20, "kesulitan": "Sulit", "kognitif": "C4" }
                ],
                "rubrik": [ { "aspek": "Pemahaman Konsep", "bobot": "40%", "kriteria": { "4": "Sangat Baik...", "3": "Baik...", "2": "Cukup...", "1": "Kurang..." } } ]
            }
            Catatan: Sesuaikan array 'soal' dengan 'jumlahSoal' dan 'tipe' yang diminta. Jangan gunakan markdown di luar JSON. Kunci jawaban wajib akurat.`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || "Terjadi kesalahan server Google AI.");
                }

                const data = await response.json();
                const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!textResponse) throw new Error("Respons AI kosong.");
                
                return extractJSON(textResponse);
            } catch (error) {
                // Catch specific API errors from Google to show user friendly message
                if (error.message === "API_KEY_MISSING" || error.message.includes("API key not valid")) {
                    throw new Error("API Key tidak valid. Silakan perbarui di menu Pengaturan API.");
                }
                throw error;
            }
        };

        const Toast = ({ message, type }) => {
            const bgColors = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-blue-500' };
            const icons = {
                success: <i className="ph-fill ph-check-circle text-xl mr-2"></i>,
                error: <i className="ph-fill ph-warning-circle text-xl mr-2"></i>,
                info: <i className="ph-fill ph-info text-xl mr-2"></i>
            };

            return (
                <div className={`fixed bottom-6 right-6 ${bgColors[type]} text-white px-5 py-4 rounded-xl shadow-2xl flex items-center z-[100] fade-in max-w-md`}>
                    {icons[type]}
                    <span className="font-medium text-sm leading-tight">{message}</span>
                </div>
            );
        };

        const Dashboard = ({ setActiveMenu, assessments }) => {
            const totalAssessments = assessments.length;
            const totalQuestions = assessments.reduce((sum, acc) => sum + (acc.data?.soal?.length || 0), 0);
            const recent = assessments.slice(0, 5);

            return (
                <div className="space-y-6 fade-in h-full flex flex-col p-2 md:p-0">
                    <div>
                        <h2 className="text-2xl font-semibold text-white">Dashboard Utama</h2>
                        <p className="text-[#8b949e] mt-1 text-sm">Platform Manajemen Asesmen AI untuk Tenaga Pendidik Profesional.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                        <div className="bg-[#161b22] p-6 rounded-lg border border-[#30363d] flex items-center hover:border-[#8b949e] transition-colors">
                            <div className="w-12 h-12 rounded-full bg-[#238636]/10 flex items-center justify-center text-[#2ea043] mr-4">
                                <i className="ph-fill ph-files text-2xl"></i>
                            </div>
                            <div>
                                <p className="text-sm text-[#8b949e] mb-1">Total Asesmen</p>
                                <p className="text-2xl font-bold text-white">{totalAssessments}</p>
                            </div>
                        </div>
                        <div className="bg-[#161b22] p-6 rounded-lg border border-[#30363d] flex items-center hover:border-[#8b949e] transition-colors">
                            <div className="w-12 h-12 rounded-full bg-[#1f6feb]/10 flex items-center justify-center text-[#58a6ff] mr-4">
                                <i className="ph-fill ph-check-square-offset text-2xl"></i>
                            </div>
                            <div>
                                <p className="text-sm text-[#8b949e] mb-1">Total Butir Soal</p>
                                <p className="text-2xl font-bold text-white">{totalQuestions}</p>
                            </div>
                        </div>
                        <div 
                            className="bg-[#238636] hover:bg-[#2ea043] p-6 rounded-lg border border-transparent flex items-center justify-between text-white cursor-pointer transition-colors" 
                            onClick={() => setActiveMenu('create')}
                        >
                            <div>
                                <p className="text-lg font-semibold">Buat Asesmen</p>
                                <p className="text-white/80 text-xs mt-1">Generasi instan via AI</p>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                                <i className="ph-bold ph-plus text-lg"></i>
                            </div>
                        </div>
                    </div>

                    <div className="bg-[#161b22] rounded-lg border border-[#30363d] flex-1 flex flex-col overflow-hidden">
                        <div className="px-5 py-4 border-b border-[#30363d] flex justify-between items-center bg-[#0d1117]">
                            <h3 className="font-semibold text-white text-sm flex items-center"><i className="ph-fill ph-clock-counter-clockwise mr-2 text-[#8b949e]"></i> Riwayat Terakhir</h3>
                            <button onClick={() => setActiveMenu('bank')} className="text-xs text-[#58a6ff] hover:underline font-semibold">Lihat Semua Data</button>
                        </div>
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-sm text-left text-[#c9d1d9]">
                                <thead className="text-xs text-[#8b949e] bg-[#161b22] border-b border-[#30363d]">
                                    <tr>
                                        <th className="px-5 py-3 font-semibold">Mata Pelajaran & Materi</th>
                                        <th className="px-5 py-3 font-semibold">Jenjang / Kelas</th>
                                        <th className="px-5 py-3 font-semibold">Jenis</th>
                                        <th className="px-5 py-3 font-semibold">Tanggal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {recent.length === 0 ? (
                                        <tr><td colSpan="4" className="px-5 py-8 text-center text-[#8b949e]">Belum ada riwayat asesmen. Mulai buat asesmen baru!</td></tr>
                                    ) : (
                                        recent.map(a => (
                                            <tr key={a.id} className="border-b border-[#30363d] hover:bg-[#21262d] transition-colors cursor-pointer" onClick={() => setActiveMenu('bank')}>
                                                <td className="px-5 py-3 font-medium text-[#58a6ff]">
                                                    {a.metadata.mapel}
                                                    <div className="text-xs text-[#8b949e] font-normal mt-0.5 truncate max-w-xs">{a.metadata.materi}</div>
                                                </td>
                                                <td className="px-5 py-3 text-sm">{a.metadata.jenjang} - {a.metadata.kelas}</td>
                                                <td className="px-5 py-3">
                                                    <span className="border border-[#30363d] text-[#8b949e] px-2 py-0.5 rounded-full text-[10px] font-semibold">{a.metadata.jenisAsesmen}</span>
                                                </td>
                                                <td className="px-5 py-3 text-sm text-[#8b949e]">{new Date(a.timestamp).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year:'numeric'})}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AssessmentForm = ({ apiKey, showToast, onGenerated, setActiveMenu }) => {
            const [isGenerating, setIsGenerating] = useState(false);
            const [formData, setFormData] = useState({
                sekolah: 'SDN KESILIR 02 LABS', guru: '', tahunAjaran: '2026/2027', semester: '1',
                jenjang: 'SD/MI', kelas: '4', mapel: '', materi: '', subMateri: '',
                tujuan: '', indikator: '', jenisAsesmen: 'Sumatif', jumlahSoal: '10', waktu: '90 Menit',
                kesulitan: 'Campuran', levelKognitif: ['C2 (Memahami)', 'C3 (Mengaplikasikan)'],
                tipeSoal: ['Pilihan Ganda'], sumberMateri: ''
            });

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                if (type === 'checkbox') {
                    const currentArray = formData[name] || [];
                    setFormData({ ...formData, [name]: checked ? [...currentArray, value] : currentArray.filter(v => v !== value) });
                } else {
                    setFormData(prev => ({ ...prev, [name]: value, ...(name === 'jenjang' ? {kelas: LEVELS[value][0]} : {}) }));
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!apiKey) { 
                    showToast("API Key belum diatur. Silakan atur di menu Pengaturan API terlebih dahulu.", "error"); 
                    setActiveMenu('settings');
                    return; 
                }
                if (formData.tipeSoal.length === 0) { showToast("Pilih minimal satu bentuk soal.", "error"); return; }
                if (formData.levelKognitif.length === 0) { showToast("Pilih minimal satu level kognitif.", "error"); return; }
                
                setIsGenerating(true);
                
                const prompt = `Buatkan asesmen pendidikan komprehensif berdasarkan parameter berikut:
                - Konteks: Sekolah: ${formData.sekolah}, Guru: ${formData.guru || '-'}, TA: ${formData.tahunAjaran}, Smt: ${formData.semester}.
                - Target: Jenjang: ${formData.jenjang}, Kelas: ${formData.kelas}.
                - Pembelajaran: Mapel: ${formData.mapel}, Materi: ${formData.materi}, Sub Materi: ${formData.subMateri || '-'}.
                - Tujuan: ${formData.tujuan || 'Sesuaikan secara logis berdasarkan materi.'}
                - Indikator: ${formData.indikator || 'Buat indikator soal spesifik yang terukur.'}
                - Referensi Materi (jika ada): ${formData.sumberMateri || 'Gunakan pengetahuan umum kurikulum.'}
                
                Spesifikasi Soal:
                - Jenis Asesmen: ${formData.jenisAsesmen}
                - Jumlah Soal: ${formData.jumlahSoal}
                - Bentuk Soal: ${formData.tipeSoal.join(', ')}
                - Tingkat Kesulitan: ${formData.kesulitan}
                - Level Kognitif: ${formData.levelKognitif.join(', ')}
                
                Instruksi AI: 
                1. Hasilkan Soal yang variatif, jelas, tidak ambigu, sesuai dengan level usia kelas ${formData.kelas} ${formData.jenjang}.
                2. Untuk tipe Pilihan Ganda, buat 4 opsi (A,B,C,D) (5 opsi untuk SMA/PT).
                3. Berikan pembahasan yang edukatif.
                4. Lengkapi Kisi-kisi.
                5. Buatkan Rubrik Umum jika bentuk soal melibatkan Uraian, Esai, Proyek atau Praktik.`;

                try {
                    const resultData = await generateWithGemini(prompt, apiKey);
                    
                    // Assign UUIDs to ensure stable rendering in editor
                    if(resultData.soal) resultData.soal.forEach(s => s.id = s.id || generateId());

                    const newAssessment = { id: generateId(), timestamp: Date.now(), metadata: { ...formData }, data: resultData };
                    onGenerated(newAssessment);
                    showToast("Berhasil meracik asesmen dengan AI!", "success");
                } catch (error) {
                    showToast(error.message, "error");
                } finally {
                    setIsGenerating(false);
                }
            };

            const sectionClass = "p-4 bg-[#0d1117] border border-[#30363d] rounded-lg mb-6 space-y-4";
            const labelClass = "block text-sm font-semibold text-[#c9d1d9] mb-1.5";
            const inputClass = "w-full p-2 bg-[#010409] border border-[#30363d] rounded-md focus:ring-2 focus:ring-[#58a6ff] focus:border-[#58a6ff] transition-all text-sm text-[#c9d1d9] outline-none placeholder-[#8b949e]";

            return (
                <div className="bg-[#161b22] rounded-lg border border-[#30363d] overflow-hidden fade-in max-w-5xl mx-auto h-full flex flex-col">
                    <div className="px-5 py-3 border-b border-[#30363d] bg-[#161b22] flex items-center justify-between">
                        <div className="flex items-center">
                            <i className="ph-fill ph-magic-wand text-[#8b949e] mr-2"></i>
                            <h2 className="font-semibold text-white text-sm">Generator Asesmen AI</h2>
                        </div>
                        <p className="text-xs text-[#8b949e] hidden md:block">Atur parameter dan biarkan AI menyusun instrumen evaluasi</p>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto">
                        <form onSubmit={handleSubmit} className="p-4 md:p-6">
                            {/* Identitas */}
                            <div className={sectionClass}>
                                <h3 className="text-sm font-semibold text-white flex items-center border-b border-[#30363d] pb-2"><i className="ph-fill ph-identification-card mr-2 text-[#8b949e]"></i> Identitas Asesmen</h3>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mt-4">
                                    <div><label className={labelClass}>Sekolah / Institusi</label><input required type="text" name="sekolah" value={formData.sekolah} onChange={handleChange} className={inputClass} /></div>
                                    <div><label className={labelClass}>Nama Pendidik</label><input type="text" name="guru" placeholder="Opsional" value={formData.guru} onChange={handleChange} className={inputClass} /></div>
                                    <div><label className={labelClass}>Tahun Ajaran</label><input required type="text" name="tahunAjaran" value={formData.tahunAjaran} onChange={handleChange} className={inputClass} /></div>
                                    <div><label className={labelClass}>Semester</label>
                                        <select name="semester" value={formData.semester} onChange={handleChange} className={inputClass}>
                                            <option value="1">Ganjil (1)</option><option value="2">Genap (2)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            {/* Kurikulum */}
                            <div className={sectionClass}>
                                <h3 className="text-sm font-semibold text-white flex items-center border-b border-[#30363d] pb-2"><i className="ph-fill ph-books mr-2 text-[#8b949e]"></i> Target & Materi Pembelajaran</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                                    <div>
                                        <label className={labelClass}>Jenjang Pendidikan</label>
                                        <select name="jenjang" value={formData.jenjang} onChange={handleChange} className={inputClass}>
                                            {Object.keys(LEVELS).map(lvl => <option key={lvl} value={lvl}>{lvl}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className={labelClass}>Kelas / Tingkat</label>
                                        <select name="kelas" value={formData.kelas} onChange={handleChange} className={inputClass}>
                                            {LEVELS[formData.jenjang].map(cls => <option key={cls} value={cls}>{cls}</option>)}
                                        </select>
                                    </div>
                                    <div><label className={labelClass}>Mata Pelajaran</label><input required type="text" name="mapel" placeholder="Contoh: Matematika" value={formData.mapel} onChange={handleChange} className={inputClass} /></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label className={labelClass}>Materi Pokok / Bab</label><input required type="text" name="materi" placeholder="Contoh: Bangun Ruang" value={formData.materi} onChange={handleChange} className={inputClass} /></div>
                                    <div><label className={labelClass}>Sub Materi (Opsional)</label><input type="text" name="subMateri" placeholder="Spesifikkan bila perlu" value={formData.subMateri} onChange={handleChange} className={inputClass} /></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label className={labelClass}>Capaian / Tujuan Pembelajaran (Opsional)</label><textarea name="tujuan" value={formData.tujuan} onChange={handleChange} rows="2" className={inputClass} placeholder="Kosongkan untuk auto-generate"></textarea></div>
                                    <div><label className={labelClass}>Referensi Materi (Opsional)</label><textarea name="sumberMateri" value={formData.sumberMateri} onChange={handleChange} rows="2" className={inputClass} placeholder="Paste teks materi disini..."></textarea></div>
                                </div>
                            </div>

                            {/* Spesifikasi Soal */}
                            <div className={sectionClass}>
                                <h3 className="text-sm font-semibold text-white flex items-center border-b border-[#30363d] pb-2"><i className="ph-fill ph-sliders-horizontal mr-2 text-[#8b949e]"></i> Spesifikasi Evaluasi</h3>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                                    <div>
                                        <label className={labelClass}>Jenis Asesmen</label>
                                        <select name="jenisAsesmen" value={formData.jenisAsesmen} onChange={handleChange} className={inputClass}>
                                            {ASSESSMENT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>
                                    <div><label className={labelClass}>Jumlah Soal Total</label><input required type="number" min="1" max="100" name="jumlahSoal" value={formData.jumlahSoal} onChange={handleChange} className={inputClass} /></div>
                                    <div><label className={labelClass}>Alokasi Waktu</label><input required type="text" name="waktu" placeholder="Misal: 120 Menit" value={formData.waktu} onChange={handleChange} className={inputClass} /></div>
                                </div>
                                
                                <div className="mt-4">
                                    <label className={labelClass}>Bentuk Soal (Pilih minimal 1)</label>
                                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2">
                                        {QUESTION_TYPES.map(type => (
                                            <label key={type} className={`flex items-center space-x-2 p-2 rounded-md border cursor-pointer transition-colors text-xs ${formData.tipeSoal.includes(type) ? 'bg-[#1f6feb]/20 border-[#58a6ff] text-[#58a6ff] font-semibold' : 'bg-[#010409] border-[#30363d] hover:border-[#8b949e] text-[#8b949e]'}`}>
                                                <input type="checkbox" name="tipeSoal" value={type} checked={formData.tipeSoal.includes(type)} onChange={handleChange} className="w-3.5 h-3.5 rounded bg-[#010409] border-[#30363d] text-[#58a6ff] focus:ring-[#58a6ff] focus:ring-offset-[#0d1117]" />
                                                <span>{type}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                                    <div>
                                        <label className={labelClass}>Tingkat Kesulitan</label>
                                        <select name="kesulitan" value={formData.kesulitan} onChange={handleChange} className={inputClass}>
                                            {DIFFICULTIES.map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className={labelClass}>Target Level Kognitif</label>
                                        <div className="grid grid-cols-2 gap-2 bg-[#010409] p-2 border border-[#30363d] rounded-md max-h-40 overflow-y-auto">
                                            {COGNITIVE_LEVELS.map(level => (
                                                <label key={level} className="flex items-center space-x-2 text-xs cursor-pointer hover:bg-[#161b22] p-1 rounded text-[#c9d1d9]">
                                                    <input type="checkbox" name="levelKognitif" value={level} checked={formData.levelKognitif.includes(level)} onChange={handleChange} className="w-3.5 h-3.5 rounded bg-[#010409] border-[#30363d] text-[#58a6ff] focus:ring-[#58a6ff] focus:ring-offset-[#0d1117]" />
                                                    <span>{level}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-4 border-t border-[#30363d] flex justify-end">
                                <button type="submit" disabled={isGenerating} className={`flex items-center px-4 py-2 rounded-md font-semibold text-white text-sm transition-colors ${isGenerating ? 'bg-[#238636]/50 cursor-wait' : 'bg-[#238636] hover:bg-[#2ea043] border border-[rgba(240,246,252,0.1)]'}`}>
                                    {isGenerating ? (
                                        <><div className="spinner mr-2 w-4 h-4 border-2"></div> Memproses...</>
                                    ) : (
                                        <><i className="ph-fill ph-cpu mr-2"></i> Generate Asesmen</>
                                    )}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const EditorView = ({ assessment, onSave, onBack, apiKey, showToast }) => {
            const [activeTab, setActiveTab] = useState('soal'); 
            const [data, setData] = useState(assessment.data);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const meta = assessment.metadata;

            // Auto-save on data change
            useEffect(() => {
                onSave({ ...assessment, data });
            }, [data]);

            // General updater for questions
            const updateSoal = (index, field, value) => {
                const newSoal = [...data.soal];
                newSoal[index] = { ...newSoal[index], [field]: value };
                setData({ ...data, soal: newSoal });
            };

            const updateOpsi = (soalIndex, opsiIndex, value) => {
                const newSoal = [...data.soal];
                newSoal[soalIndex].opsi[opsiIndex] = value;
                setData({ ...data, soal: newSoal });
            };

            const removeSoal = (index) => {
                if(confirm('Hapus soal ini?')) {
                    const newSoal = data.soal.filter((_, i) => i !== index).map((s, i) => ({...s, no: i+1}));
                    setData({ ...data, soal: newSoal });
                }
            };
            
            const moveSoal = (index, direction) => {
                if (direction === 'up' && index > 0) {
                    const newSoal = [...data.soal];
                    [newSoal[index-1], newSoal[index]] = [newSoal[index], newSoal[index-1]];
                    newSoal.forEach((s, i) => s.no = i + 1);
                    setData({ ...data, soal: newSoal });
                } else if (direction === 'down' && index < data.soal.length - 1) {
                    const newSoal = [...data.soal];
                    [newSoal[index], newSoal[index+1]] = [newSoal[index+1], newSoal[index]];
                    newSoal.forEach((s, i) => s.no = i + 1);
                    setData({ ...data, soal: newSoal });
                }
            };

            const addSoalBlank = () => {
                const newSoalItem = { id: generateId(), no: data.soal.length + 1, tipe: meta.tipeSoal[0], pertanyaan: 'Pertanyaan baru...', skor: 10 };
                if (meta.tipeSoal[0].includes('Pilihan Ganda')) newSoalItem.opsi = ["A. ", "B. ", "C. ", "D. "];
                setData({ ...data, soal: [...data.soal, newSoalItem] });
            };

            // Individual AI Actions per Question
            const aiQuestionAction = async (index, actionType) => {
                if (!apiKey) return showToast("API Key diperlukan untuk fitur ini.", "error");
                setIsAiLoading(true);
                
                const original = data.soal[index];
                let instruction = "";
                if(actionType === 'fix') instruction = "Perbaiki tata bahasa, struktur, dan ejaan soal ini agar lebih baku dan profesional secara akademis.";
                if(actionType === 'harder') instruction = "Tingkatkan level kesulitan (HOTS) soal ini tanpa mengubah materi inti. Jika pilihan ganda, buat distraktor lebih mengecoh.";
                if(actionType === 'variation') instruction = "Buat 1 variasi soal baru yang setara (paralel) dari soal ini. Beda angka/konteks tapi konsep sama.";
                
                const prompt = `${instruction}\nData Soal Asli: ${JSON.stringify(original)}\n\nKeluarkan HANYA JSON single object soal yang strukturnya sama persis seperti input, tanpa tambahan apapun.`;
                
                try {
                    const res = await generateWithGemini(prompt, apiKey);
                    res.no = original.no;
                    res.id = original.id;
                    const newSoal = [...data.soal];
                    newSoal[index] = res;
                    setData({ ...data, soal: newSoal });
                    showToast("Soal berhasil di-update oleh AI!", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsAiLoading(false);
                }
            };

            const exportWord = () => exportHTMLToWord('printable-area', `Asesmen_${meta.mapel}_Kelas_${meta.kelas}.doc`);

            return (
                <div className="flex flex-col h-full bg-[#0d1117] rounded-lg border border-[#30363d] overflow-hidden fade-in relative print-container">
                    
                    {/* Header Action Bar */}
                    <div className="px-4 py-3 border-b border-[#30363d] bg-[#161b22] flex flex-col md:flex-row justify-between items-start md:items-center gap-3 no-print z-10">
                        <div>
                            <div className="flex items-center gap-2 mb-1 text-sm text-[#8b949e]">
                                <button onClick={onBack} className="hover:text-[#58a6ff] hover:underline flex items-center">
                                     Dashboard
                                </button>
                                <span>/</span>
                                <span className="text-[#c9d1d9] font-semibold">{meta.mapel}</span>
                            </div>
                            <h2 className="font-semibold text-lg text-white flex items-center gap-2">
                                {meta.materi}
                            </h2>
                            <p className="text-xs text-[#8b949e] mt-0.5">
                                {meta.jenjang} Kelas {meta.kelas} • {meta.jenisAsesmen} • {data.soal?.length || 0} Soal
                            </p>
                        </div>
                        <div className="flex flex-wrap gap-2 w-full md:w-auto">
                            <button onClick={() => window.print()} className="flex-1 md:flex-none px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] hover:border-[#8b949e] text-[#c9d1d9] rounded-md text-xs font-semibold flex items-center justify-center transition-colors">
                                <i className="ph-fill ph-printer mr-1.5 text-sm"></i> Print
                            </button>
                            <button onClick={exportWord} className="flex-1 md:flex-none px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] hover:border-[#8b949e] text-[#c9d1d9] rounded-md text-xs font-semibold flex items-center justify-center transition-colors">
                                <i className="ph-fill ph-file-doc mr-1.5 text-sm"></i> Word
                            </button>
                            <button onClick={() => {
                                const ws = XLSX.utils.json_to_sheet(data.kisiKisi || []);
                                const wb = XLSX.utils.book_new();
                                XLSX.utils.book_append_sheet(wb, ws, "Kisi-Kisi");
                                XLSX.writeFile(wb, `Kisi-Kisi_${meta.mapel}.xlsx`);
                            }} className="flex-1 md:flex-none px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] hover:border-[#8b949e] text-[#c9d1d9] rounded-md text-xs font-semibold flex items-center justify-center transition-colors">
                                <i className="ph-fill ph-file-xls mr-1.5 text-sm"></i> Excel
                            </button>
                        </div>
                    </div>

                    {/* Editor Navigation Tabs */}
                    <div className="flex border-b border-[#30363d] bg-[#0d1117] px-4 overflow-x-auto no-print hide-scroll">
                        {[
                            {id: 'soal', label: 'Soal', icon: 'ph-file-text'},
                            {id: 'kunci', label: 'Kunci', icon: 'ph-key'},
                            {id: 'kisi', label: 'Kisi-Kisi', icon: 'ph-table'},
                            {id: 'rubrik', label: 'Rubrik', icon: 'ph-clipboard-text'}
                        ].map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`px-4 py-3 font-semibold text-sm flex items-center border-b-2 whitespace-nowrap transition-colors ${activeTab === t.id ? 'border-[#f78166] text-white' : 'border-transparent text-[#8b949e] hover:text-[#c9d1d9] hover:border-[#8b949e]/50'}`}>
                                <i className={`ph-fill ${t.icon} mr-2`}></i> {t.label}
                            </button>
                        ))}
                    </div>

                    {/* Scrollable Content Area */}
                    <div className="flex-1 overflow-y-auto p-4 md:p-8 bg-[#0d1117] relative print-container" id="printable-area">
                        
                        {/* Print Header (Visible ONLY during print/export) */}
                        <div className="print-only text-center mb-8 border-b-2 border-black pb-4 avoid-break">
                            <h2 className="text-xl font-bold uppercase tracking-wider m-0">{meta.sekolah}</h2>
                            <h3 className="text-lg font-bold uppercase m-0 mt-1">ASESMEN {meta.jenisAsesmen}</h3>
                            <h4 className="text-sm font-semibold m-0 mt-1">TAHUN AJARAN {meta.tahunAjaran}</h4>
                            
                            <table className="w-full mt-6 text-left text-sm font-bold print-table" style={{border: 'none'}}>
                                <tbody>
                                    <tr style={{border: 'none'}}>
                                        <td style={{border: 'none', padding: '2px', width: '60%'}}>Mata Pelajaran : {meta.mapel}</td>
                                        <td style={{border: 'none', padding: '2px', width: '40%'}}>Nama  : _________________________</td>
                                    </tr>
                                    <tr style={{border: 'none'}}>
                                        <td style={{border: 'none', padding: '2px'}}>Kelas / Jenjang : {meta.kelas} / {meta.jenjang}</td>
                                        <td style={{border: 'none', padding: '2px'}}>No/Kelas : _________________________</td>
                                    </tr>
                                    <tr style={{border: 'none'}}>
                                        <td style={{border: 'none', padding: '2px'}}>Alokasi Waktu : {meta.waktu}</td>
                                        <td style={{border: 'none', padding: '2px'}}>Tanggal : _________________________</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        {isAiLoading && (
                            <div className="absolute inset-0 bg-[#0d1117]/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center no-print">
                                <div className="spinner border-[#58a6ff] border-t-transparent w-8 h-8 mb-4"></div>
                                <p className="font-semibold text-[#58a6ff] text-sm">Processing...</p>
                            </div>
                        )}

                        {/* --- TAB: SOAL SISWA --- */}
                        {activeTab === 'soal' && (
                            <div className="max-w-4xl mx-auto">
                                <div className="flex justify-between items-center mb-6 no-print border-b border-[#30363d] pb-2">
                                    <h3 className="text-lg font-semibold text-white">Lembar Soal</h3>
                                    <button onClick={addSoalBlank} className="px-3 py-1.5 bg-[#238636] hover:bg-[#2ea043] text-white rounded-md text-xs font-semibold border border-[rgba(240,246,252,0.1)]">
                                        Tambah Soal
                                    </button>
                                </div>
                                
                                <div className="space-y-4">
                                {data.soal?.map((item, index) => (
                                    <div key={item.id || index} className="group relative border border-[#30363d] p-4 rounded-lg transition-all print:p-0 print:border-none print:mb-6 avoid-break bg-[#161b22] hover:border-[#8b949e]">
                                        
                                        {/* Editor Floating Controls */}
                                        <div className="editor-controls absolute -top-3 right-4 hidden group-hover:flex bg-[#21262d] border border-[#30363d] rounded-md p-1 space-x-1 z-20">
                                            <button onClick={() => moveSoal(index, 'up')} className="p-1 text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#30363d] rounded" title="Naik"><i className="ph-bold ph-caret-up"></i></button>
                                            <button onClick={() => moveSoal(index, 'down')} className="p-1 text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#30363d] rounded" title="Turun"><i className="ph-bold ph-caret-down"></i></button>
                                            <div className="w-px bg-[#30363d] mx-1"></div>
                                            <button onClick={() => aiQuestionAction(index, 'fix')} className="p-1 text-[#58a6ff] hover:bg-[#58a6ff]/10 rounded" title="AI: Perbaiki Bahasa"><i className="ph-bold ph-text-aa"></i></button>
                                            <button onClick={() => aiQuestionAction(index, 'harder')} className="p-1 text-[#e34c26] hover:bg-[#e34c26]/10 rounded" title="AI: Tingkatkan HOTS"><i className="ph-bold ph-trend-up"></i></button>
                                            <button onClick={() => aiQuestionAction(index, 'variation')} className="p-1 text-[#a371f7] hover:bg-[#a371f7]/10 rounded" title="AI: Buat Variasi"><i className="ph-bold ph-arrows-split"></i></button>
                                            <div className="w-px bg-[#30363d] mx-1"></div>
                                            <button onClick={() => removeSoal(index)} className="p-1 text-[#f85149] hover:bg-[#f85149]/10 rounded" title="Hapus Soal"><i className="ph-bold ph-trash"></i></button>
                                        </div>

                                        <div className="flex gap-3">
                                            <span className="font-semibold text-[#8b949e] text-sm w-6 flex-shrink-0 pt-1">{item.no}.</span>
                                            <div className="flex-1 space-y-3">
                                                {/* Textarea for question */}
                                                <textarea 
                                                    value={item.pertanyaan} 
                                                    onChange={(e) => updateSoal(index, 'pertanyaan', e.target.value)}
                                                    className="w-full bg-transparent resize-none overflow-hidden focus:outline-none border-b border-transparent focus:border-[#58a6ff] print-input print:p-0 text-sm text-[#c9d1d9] pb-1"
                                                    rows={Math.max(2, item.pertanyaan?.split('\n').length || 2)}
                                                    style={{minHeight: '2rem'}}
                                                />
                                                <div className="print-only print-content text-sm whitespace-pre-wrap text-black">{item.pertanyaan}</div>

                                                {/* Rendering Options for Multiple Choice */}
                                                {item.opsi && item.opsi.length > 0 && (
                                                    <div className="space-y-1.5 pl-2">
                                                        {item.opsi.map((opt, oIdx) => {
                                                            const isCorrect = opt.startsWith(item.jawaban);
                                                            return(
                                                                <div key={oIdx} className="flex items-start group/opt">
                                                                    <div className="flex-1 relative flex items-center">
                                                                        <input 
                                                                            type="text" 
                                                                            value={opt} 
                                                                            onChange={(e) => updateOpsi(index, oIdx, e.target.value)}
                                                                            className="w-full bg-transparent border border-transparent hover:border-[#30363d] focus:outline-none focus:border-[#58a6ff] rounded px-2 py-1 text-sm text-[#8b949e] print-input print:border-none print:p-0 print:m-0"
                                                                        />
                                                                        <div className="print-only print-content whitespace-pre-wrap text-black">{opt}</div>
                                                                    </div>
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                )}
                                                
                                                {/* Essay/Short Answer Blank Space (Print only) */}
                                                {(!item.opsi || item.opsi.length === 0) && (
                                                    <div className="mt-6 mb-4 border-b-2 border-dotted border-slate-400 h-24 print-only w-full"></div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                </div>
                            </div>
                        )}

                        {/* --- TAB: KUNCI JAWABAN --- */}
                        {activeTab === 'kunci' && (
                            <div className="max-w-4xl mx-auto space-y-4">
                                <div className="border-b border-[#30363d] pb-2 mb-6 no-print">
                                    <h3 className="text-lg font-semibold text-white">Kunci Jawaban & Panduan</h3>
                                </div>
                                <div className="print-only text-center mb-6"><h3 className="text-xl font-bold uppercase">KUNCI JAWABAN & PEMBAHASAN</h3></div>
                                
                                {data.soal?.map((item, index) => (
                                    <div key={index} className="bg-[#161b22] p-4 rounded-lg border border-[#30363d] avoid-break print:bg-transparent print:border-none print:border-b print:border-slate-300 print:rounded-none">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="font-semibold text-white text-sm">Soal No. {item.no}</span>
                                            <div className="flex space-x-2 text-xs font-semibold">
                                                <span className="border border-[#30363d] text-[#8b949e] px-2 py-0.5 rounded-full">Skor: {item.skor || '-'}</span>
                                                <span className="border border-[#58a6ff]/30 text-[#58a6ff] bg-[#58a6ff]/10 px-2 py-0.5 rounded-full">{item.kognitif || item.levelKognitif || 'C-'}</span>
                                            </div>
                                        </div>
                                        
                                        <p className="text-sm text-[#8b949e] italic mb-4 pb-4 border-b border-[#30363d] whitespace-pre-wrap">{item.pertanyaan}</p>
                                        
                                        {item.opsi && item.opsi.length > 0 ? (
                                            <div className="space-y-3 text-sm">
                                                <div className="flex items-center"><div className="w-24 font-semibold text-[#8b949e]">Jawaban</div><div className="font-bold text-[#3fb950] bg-[#3fb950]/10 px-2 py-0.5 rounded border border-[#3fb950]/20">{item.jawaban}</div></div>
                                                <div className="flex items-start"><div className="w-24 font-semibold text-[#8b949e] shrink-0 pt-2">Pembahasan</div><div className="text-[#c9d1d9] bg-[#0d1117] p-3 rounded-md border border-[#30363d] flex-1 whitespace-pre-wrap leading-relaxed">{item.pembahasan || '-'}</div></div>
                                            </div>
                                        ) : (
                                            <div className="space-y-3 text-sm">
                                                <div className="flex items-start"><div className="w-28 font-semibold text-[#8b949e] shrink-0 pt-2">Kunci Ideal</div><div className="text-[#3fb950] font-medium bg-[#3fb950]/10 p-3 rounded-md border border-[#3fb950]/20 flex-1 whitespace-pre-wrap">{item.jawabanIdeal || item.jawaban}</div></div>
                                                {item.pedomanPenskoran && (
                                                    <div className="flex items-start"><div className="w-28 font-semibold text-[#8b949e] shrink-0 pt-2">Pedoman Nilai</div><div className="text-[#58a6ff] bg-[#58a6ff]/10 p-3 rounded-md border border-[#58a6ff]/20 flex-1 whitespace-pre-wrap">{item.pedomanPenskoran}</div></div>
                                                )}
                                                {item.pembahasan && (
                                                     <div className="flex items-start"><div className="w-28 font-semibold text-[#8b949e] shrink-0 pt-2">Pembahasan</div><div className="text-[#c9d1d9] bg-[#0d1117] p-3 rounded-md border border-[#30363d] flex-1 whitespace-pre-wrap leading-relaxed">{item.pembahasan}</div></div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* --- TAB: KISI-KISI --- */}
                        {activeTab === 'kisi' && (
                            <div className="w-full">
                                <div className="border-b border-[#30363d] pb-2 mb-6 no-print">
                                    <h3 className="text-lg font-semibold text-white">Kisi-Kisi Penulisan Soal</h3>
                                </div>
                                <div className="print-only text-center mb-6"><h3 className="text-xl font-bold uppercase">KISI-KISI SOAL ASESMEN</h3></div>
                                
                                <div className="overflow-x-auto w-full rounded-lg border border-[#30363d]">
                                    <table className="w-full text-sm text-left border-collapse print-table text-[#c9d1d9]">
                                        <thead className="bg-[#161b22] text-[#8b949e] text-xs uppercase">
                                            <tr>
                                                <th className="border-b border-r border-[#30363d] p-3 text-center w-10">No</th>
                                                <th className="border-b border-r border-[#30363d] p-3">Tujuan Pembelajaran</th>
                                                <th className="border-b border-r border-[#30363d] p-3">Materi Pokok</th>
                                                <th className="border-b border-r border-[#30363d] p-3">Indikator Soal</th>
                                                <th className="border-b border-r border-[#30363d] p-3 text-center">Level</th>
                                                <th className="border-b border-r border-[#30363d] p-3 text-center">Bentuk</th>
                                                <th className="border-b border-[#30363d] p-3 text-center">Skor</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-[#0d1117]">
                                            {data.kisiKisi && data.kisiKisi.length > 0 ? data.kisiKisi.map((k, i) => (
                                                <tr key={i} className="hover:bg-[#161b22] avoid-break border-b border-[#30363d] last:border-0">
                                                    <td className="border-r border-[#30363d] p-3 text-center text-[#8b949e]">{k.no}</td>
                                                    <td className="border-r border-[#30363d] p-3">{k.tujuan}</td>
                                                    <td className="border-r border-[#30363d] p-3">{k.materi}</td>
                                                    <td className="border-r border-[#30363d] p-3">{k.indikator}</td>
                                                    <td className="border-r border-[#30363d] p-3 text-center whitespace-nowrap"><span className="text-[#58a6ff] bg-[#58a6ff]/10 px-2 py-0.5 rounded text-[10px] border border-[#58a6ff]/20">{k.level || k.levelKognitif}</span></td>
                                                    <td className="border-r border-[#30363d] p-3 text-center text-xs whitespace-nowrap">{k.bentuk || k.bentukSoal}</td>
                                                    <td className="p-3 text-center font-semibold text-[#3fb950]">{k.skor}</td>
                                                </tr>
                                            )) : <tr><td colSpan="7" className="text-center p-8 text-[#8b949e]">Data kisi-kisi tidak tersedia.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* --- TAB: RUBRIK --- */}
                        {activeTab === 'rubrik' && (
                            <div className="w-full">
                                <div className="border-b border-[#30363d] pb-2 mb-6 no-print">
                                    <h3 className="text-lg font-semibold text-white">Rubrik Penilaian Kinerja</h3>
                                </div>
                                <div className="print-only text-center mb-6"><h3 className="text-xl font-bold uppercase">RUBRIK PENILAIAN</h3></div>
                                
                                {data.rubrik && data.rubrik.length > 0 ? (
                                    <div className="overflow-x-auto w-full rounded-lg border border-[#30363d]">
                                        <table className="w-full text-sm text-left border-collapse print-table text-[#c9d1d9]">
                                            <thead className="bg-[#161b22] text-[#8b949e] text-xs">
                                                <tr>
                                                    <th className="border-b border-r border-[#30363d] p-3 w-1/5 uppercase">Aspek Penilaian</th>
                                                    <th className="border-b border-r border-[#30363d] p-3 text-center w-16 uppercase">Bobot</th>
                                                    <th className="border-b border-r border-[#30363d] p-3 text-center text-[#3fb950]">Sangat Baik (4)</th>
                                                    <th className="border-b border-r border-[#30363d] p-3 text-center text-[#58a6ff]">Baik (3)</th>
                                                    <th className="border-b border-r border-[#30363d] p-3 text-center text-[#d29922]">Cukup (2)</th>
                                                    <th className="border-b border-[#30363d] p-3 text-center text-[#f85149]">Kurang (1)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-[#0d1117]">
                                                {data.rubrik.map((r, i) => (
                                                    <tr key={i} className="hover:bg-[#161b22] avoid-break border-b border-[#30363d] last:border-0">
                                                        <td className="border-r border-[#30363d] p-3 font-medium text-white">{r.aspek}</td>
                                                        <td className="border-r border-[#30363d] p-3 text-center bg-[#161b22]/50 text-[#8b949e]">{r.bobot || '-'}</td>
                                                        <td className="border-r border-[#30363d] p-3 text-xs">{r.kriteria?.["4"] || '-'}</td>
                                                        <td className="border-r border-[#30363d] p-3 text-xs">{r.kriteria?.["3"] || '-'}</td>
                                                        <td className="border-r border-[#30363d] p-3 text-xs">{r.kriteria?.["2"] || '-'}</td>
                                                        <td className="p-3 text-xs">{r.kriteria?.["1"] || '-'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                ) : (
                                    <div className="p-10 text-center bg-[#161b22] rounded-lg border border-[#30363d] text-[#8b949e] flex flex-col items-center">
                                        <i className="ph-fill ph-clipboard-text text-4xl mb-3 text-[#30363d]"></i>
                                        <p className="font-semibold text-sm">Tidak ada rubrik yang digenerate.</p>
                                        <p className="text-xs mt-1">Rubrik biasanya muncul otomatis jika memilih jenis soal Uraian, Esai, atau Praktik.</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const BankSoal = ({ assessments, onSelect, onDelete }) => {
            const [searchTerm, setSearchTerm] = useState('');
            
            const filtered = assessments.filter(a => 
                a.metadata.mapel.toLowerCase().includes(searchTerm.toLowerCase()) || 
                a.metadata.materi.toLowerCase().includes(searchTerm.toLowerCase()) ||
                a.metadata.kelas.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-[#161b22] rounded-lg border border-[#30363d] overflow-hidden h-full flex flex-col fade-in">
                    <div className="px-5 py-4 border-b border-[#30363d] bg-[#0d1117] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 className="font-semibold text-white text-lg flex items-center">
                            <i className="ph-fill ph-database mr-2 text-[#8b949e]"></i> Bank Soal
                        </h2>
                        <div className="relative w-full sm:w-64">
                            <i className="ph-fill ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-[#8b949e]"></i>
                            <input 
                                type="text" 
                                placeholder="Cari repositori soal..." 
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full pl-9 pr-3 py-1.5 bg-[#010409] border border-[#30363d] rounded-md text-sm text-[#c9d1d9] focus:ring-1 focus:ring-[#58a6ff] focus:border-[#58a6ff] outline-none placeholder-[#8b949e]"
                            />
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 bg-[#0d1117]">
                        {filtered.length === 0 ? (
                            <div className="text-center text-[#8b949e] mt-20 flex flex-col items-center">
                                <i className="ph-fill ph-archive-box text-5xl text-[#30363d] mb-4"></i>
                                <p className="font-semibold">Belum ada repositori asesmen.</p>
                                <p className="text-xs mt-1">Buat asesmen baru di menu Generator AI.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                                {filtered.map(a => (
                                    <div key={a.id} className="border border-[#30363d] rounded-md p-4 bg-[#161b22] flex flex-col hover:border-[#8b949e] transition-colors group">
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="flex items-center gap-2 text-[#8b949e]">
                                                <i className="ph-fill ph-book-open"></i>
                                                <h3 className="font-semibold text-[#58a6ff] text-sm hover:underline cursor-pointer" onClick={() => onSelect(a)}>{a.metadata.mapel}</h3>
                                            </div>
                                            <button onClick={() => {if(confirm('Hapus asesmen ini permanen?')) onDelete(a.id)}} className="text-[#8b949e] hover:text-[#f85149] transition-colors" title="Hapus"><i className="ph-fill ph-trash text-sm"></i></button>
                                        </div>
                                        <p className="text-xs text-[#8b949e] mb-4 line-clamp-2">{a.metadata.materi}</p>
                                        
                                        <div className="mt-auto flex items-center gap-4 text-xs text-[#8b949e]">
                                            <span className="flex items-center gap-1.5">
                                                <span className="w-2 h-2 rounded-full bg-[#d29922]"></span>
                                                {a.metadata.jenjang} - {a.metadata.kelas}
                                            </span>
                                            <span className="flex items-center gap-1">
                                                <i className="ph-fill ph-file-text"></i> {a.data?.soal?.length || 0}
                                            </span>
                                            <span className="ml-auto border border-[#30363d] px-1.5 py-0.5 rounded-full text-[10px]">
                                                {a.metadata.jenisAsesmen}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Settings = ({ apiKey, setApiKey, showToast }) => {
            const [inputKey, setInputKey] = useState(apiKey);
            
            const handleSave = () => {
                if(inputKey.trim() === '') {
                    showToast("API Key tidak boleh kosong", "error");
                    return;
                }
                setApiKey(inputKey.trim());
                showToast("Pengaturan API Key berhasil disimpan!", "success");
            };

            return (
                <div className="max-w-3xl mx-auto bg-[#161b22] rounded-lg border border-[#30363d] overflow-hidden fade-in">
                    <div className="px-5 py-4 border-b border-[#30363d] bg-[#0d1117] flex items-center">
                        <i className="ph-fill ph-key text-[#8b949e] text-xl mr-3"></i>
                        <div>
                            <h2 className="font-semibold text-white text-sm">Pengaturan API</h2>
                            <p className="text-xs text-[#8b949e]">Konfigurasi akses ke Google Gemini AI</p>
                        </div>
                    </div>
                    <div className="p-5 md:p-6 space-y-6">
                        
                        {(!apiKey || apiKey === '') && (
                            <div className="bg-[#f85149]/10 border border-[#f85149]/30 p-3 rounded-md flex items-start">
                                <i className="ph-fill ph-warning-circle text-[#f85149] text-base mr-3 mt-0.5"></i>
                                <div>
                                    <h4 className="font-semibold text-[#f85149] text-xs">API Key Belum Diatur</h4>
                                    <p className="text-xs text-[#c9d1d9] mt-1">Anda memerlukan Google Gemini API Key yang valid untuk menghasilkan soal.</p>
                                </div>
                            </div>
                        )}

                        <div>
                            <label className="block text-sm font-semibold text-white mb-2">Google Gemini API Key</label>
                            <div className="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-2">
                                <input 
                                    type="password" 
                                    value={inputKey} 
                                    onChange={(e) => setInputKey(e.target.value)}
                                    placeholder="Paste API Key (AIzaSy...)"
                                    className="flex-1 px-3 py-1.5 bg-[#010409] border border-[#30363d] rounded-md focus:ring-1 focus:ring-[#58a6ff] focus:border-[#58a6ff] outline-none text-sm font-mono text-[#c9d1d9]"
                                />
                                <button onClick={handleSave} className="bg-[#238636] hover:bg-[#2ea043] text-white px-4 py-1.5 rounded-md font-semibold text-sm border border-[rgba(240,246,252,0.1)] transition-colors">
                                    Save
                                </button>
                            </div>
                        </div>

                        <div className="border border-[#30363d] rounded-md p-4 bg-[#0d1117]">
                            <h4 className="font-semibold text-white text-sm mb-2">Cara Mendapatkan API Key</h4>
                            <ol className="list-decimal list-inside text-sm text-[#8b949e] space-y-1.5 ml-1">
                                <li>Buka <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-[#58a6ff] hover:underline">Google AI Studio</a>.</li>
                                <li>Login dengan akun Google.</li>
                                <li>Klik <strong>Create API Key</strong>.</li>
                                <li>Copy key yang diawali dengan <code className="bg-[#161b22] px-1 py-0.5 rounded text-[#c9d1d9]">AIza...</code></li>
                            </ol>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const { apiKey, setApiKey, assessments, saveAssessment, deleteAssessment, toast, showToast } = useAppStore();
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [currentAssessment, setCurrentAssessment] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const menuItems = [
                { id: 'dashboard', icon: 'ph-house', label: 'Dashboard' },
                { id: 'create', icon: 'ph-plus', label: 'Buat Asesmen' },
                { id: 'bank', icon: 'ph-repo', label: 'Bank Soal' },
                { id: 'settings', icon: 'ph-gear', label: 'Settings' },
            ];

            const renderContent = () => {
                if (currentAssessment) {
                    return <EditorView assessment={currentAssessment} onSave={saveAssessment} onBack={() => setCurrentAssessment(null)} apiKey={apiKey} showToast={showToast} />;
                }
                switch (activeMenu) {
                    case 'dashboard': return <Dashboard setActiveMenu={setActiveMenu} assessments={assessments} />;
                    case 'create': return <AssessmentForm apiKey={apiKey} showToast={showToast} setActiveMenu={setActiveMenu} onGenerated={(data) => { saveAssessment(data); setCurrentAssessment(data); }} />;
                    case 'bank': return <BankSoal assessments={assessments} onSelect={setCurrentAssessment} onDelete={deleteAssessment} />;
                    case 'settings': return <Settings apiKey={apiKey} setApiKey={setApiKey} showToast={showToast} />;
                    default: return <Dashboard setActiveMenu={setActiveMenu} assessments={assessments} />;
                }
            };

            return (
                <div className="flex h-screen w-full bg-[#0d1117] overflow-hidden font-sans">
                    {/* Desktop Sidebar (Github like) */}
                    <aside className="hidden md:flex flex-col w-64 bg-[#0d1117] border-r border-[#30363d] z-20 no-print transition-all">
                        <div className="px-5 py-4 flex items-center border-b border-[#30363d]">
                            <i className="ph-fill ph-github-logo text-3xl text-white mr-3"></i>
                            <div>
                                <h1 className="font-semibold text-sm text-white leading-tight">SDN KESILIR 02</h1>
                                <div className="text-[#8b949e] text-xs">AI Labs</div>
                            </div>
                        </div>
                        <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                            {menuItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => { setActiveMenu(item.id); setCurrentAssessment(null); }}
                                    className={`w-full flex items-center px-3 py-1.5 rounded-md text-sm transition-colors ${!currentAssessment && activeMenu === item.id ? 'bg-[#161b22] text-white font-semibold' : 'text-[#c9d1d9] hover:bg-[#161b22] hover:text-white'}`}
                                >
                                    <i className={`ph-fill ${item.icon} text-lg mr-2 ${!currentAssessment && activeMenu === item.id ? 'text-[#8b949e]' : 'text-[#8b949e]'}`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="px-5 py-4 border-t border-[#30363d] text-xs text-[#8b949e]">
                            &copy; 2026 SDN Kesilir 02 Labs
                        </div>
                    </aside>

                    {/* Mobile Header */}
                    <div className="md:hidden absolute top-0 left-0 w-full bg-[#010409] border-b border-[#30363d] text-white p-3 flex justify-between items-center z-50 no-print">
                        <div className="flex items-center font-semibold text-sm">
                            <i className="ph-fill ph-github-logo text-xl mr-2"></i>
                            <span>SDN KESILIR 02</span>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-1 text-[#8b949e] hover:text-white border border-[#30363d] rounded-md bg-[#21262d]">
                            <i className={`ph-bold ${isMobileMenuOpen ? 'ph-x' : 'ph-list'} text-lg`}></i>
                        </button>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMobileMenuOpen && (
                        <div className="md:hidden absolute top-[45px] left-0 w-full bg-[#0d1117] border-b border-[#30363d] z-40 no-print animate-fade-in">
                            <nav className="p-3 space-y-1">
                                {menuItems.map(item => (
                                    <button 
                                        key={item.id}
                                        onClick={() => { setActiveMenu(item.id); setCurrentAssessment(null); setIsMobileMenuOpen(false); }}
                                        className={`w-full flex items-center px-3 py-2 rounded-md text-sm ${!currentAssessment && activeMenu === item.id ? 'bg-[#161b22] text-white font-semibold' : 'text-[#c9d1d9] hover:bg-[#161b22]'}`}
                                    >
                                        <i className={`ph-fill ${item.icon} text-lg mr-2 text-[#8b949e]`}></i> {item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="flex-1 relative flex flex-col h-full w-full overflow-hidden mt-[45px] md:mt-0 pt-0 md:p-6 bg-[#010409]">
                        <div className="flex-1 h-full w-full max-w-7xl mx-auto relative rounded-none md:rounded-lg overflow-hidden border-none md:border md:border-[#30363d] bg-[#0d1117]">
                            {renderContent()}
                        </div>
                    </main>

                    {toast && <Toast message={toast.msg} type={toast.type} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
